name: Simple Video Editor (Windows)

on:
  push:
    paths:
      - "video-editor/**"
      - ".github/workflows/video-editor-windows.yml"
  pull_request:
    paths:
      - "video-editor/**"
      - ".github/workflows/video-editor-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-editor-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build the Windows app
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: video-editor
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: video-editor
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video-editor/package-lock.json
      - run: npm ci
      # Includes a real export with the bundled Windows ffmpeg.
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SimpleVideoEditor-windows
          path: |
            video-editor/dist/*.exe
            video-editor/dist/*.zip
          if-no-files-found: error
          retention-days: 30
